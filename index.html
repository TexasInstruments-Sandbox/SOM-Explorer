<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TI SOM Explorer</title>
    <link rel="icon" type="image/svg+xml" href="./assets/ti-bug.svg?v=20260730-logo-status-fix">
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("tiSomTheme") || "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260730-compact-footer">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="homeLink" type="button" aria-label="Return to TI SOM Explorer home">
          <img class="ti-mark" src="./assets/ti-bug.svg?v=20260730-logo-status-fix" alt="">
          <div>
            <h1>TI SOM Explorer</h1>
            <p id="sourceLine">Loading SOM data</p>
          </div>
        </button>
        <div class="toolbar" aria-label="Appearance">
          <button class="tool-button theme-toggle" id="themeToggle" type="button" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

    <div class="content-area">
      <main class="workbench">
        <aside class="control-rail" aria-label="Explorer filters and view controls">
          <label class="field">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Module, partner, device">
          </label>

          <fieldset class="field-group">
            <legend>View</legend>
            <div class="segmented" role="group" aria-label="Visualization type">
              <button type="button" class="segment is-active" data-view-mode="board">Overview</button>
              <button type="button" class="segment" data-view-mode="map">Map</button>
              <button type="button" class="segment" data-view-mode="partners">Partners</button>
              <button type="button" class="segment" data-view-mode="formFactors">Form Factors</button>
              <button type="button" class="segment" data-view-mode="matrix">Matrix</button>
              <button type="button" class="segment" data-view-mode="directory">Directory</button>
            </div>
          </fieldset>

          <label class="field">
            <span>Group by</span>
            <select id="groupBy">
              <option value="device">Device</option>
              <option value="region">Region</option>
              <option value="vendor">Partner</option>
              <option value="formFactorFamily">Form factor</option>
              <option value="lifecycle">Status</option>
              <option value="partnerProgram">Partner program</option>
            </select>
          </label>

          <label class="field">
            <span>Color by</span>
            <select id="colorBy">
              <option value="formFactorFamily">Form factor</option>
              <option value="lifecycle">Status</option>
              <option value="region">Region</option>
              <option value="partnerProgram">Partner program</option>
              <option value="device">Device</option>
            </select>
          </label>

          <div class="filter-stack" id="filterStack"></div>

          <button class="reset-button" id="resetFilters" type="button">Reset filters</button>
        </aside>

        <section class="workspace" aria-live="polite">
          <div class="kpis" id="kpis"></div>

          <div class="view-meta">
            <div class="view-heading">
              <h2 id="viewTitle">Modules by device</h2>
              <div class="filter-status" id="filterStatus" hidden></div>
            </div>
            <div class="legend" id="legend" aria-label="Color legend"></div>
          </div>

          <section class="visualization" id="visualization"></section>
        </section>
      </main>

      <aside class="detail-drawer" id="detailDrawer" aria-label="Module details" aria-hidden="true">
        <div class="drawer-inner">
          <button class="drawer-close" id="drawerClose" type="button" aria-label="Close details">Close</button>
          <div id="drawerContent"></div>
        </div>
      </aside>
    </div>

    <footer class="site-footer">
      <p class="footer-copyright">© Copyright 1995–2026 Texas Instruments Incorporated. All rights reserved.</p>
      <nav class="footer-links" aria-label="Texas Instruments policies">
        <a href="https://www.ti.com/legal/terms-conditions/cookie-policy.html">Cookie policy</a>
        <a href="https://www.ti.com/legal/terms-conditions/privacy-policy.html">Privacy policy</a>
        <a href="https://www.ti.com/legal/terms-conditions/terms-of-use.html">Terms of use</a>
        <a href="https://www.ti.com/legal/terms-conditions/trademarks.html">Trademarks</a>
      </nav>
    </footer>

    <noscript>TI SOM Explorer requires JavaScript.</noscript>
    <script src="./data/soms-data.js?v=20260730-clean-spec-copy"></script>
    <script src="./assets/logos/manifest-data.js?v=20260730-logo-status-fix"></script>
    <script src="./assets/partner-badges/manifest-data.js?v=20260730-logo-status-fix"></script>
    <script src="./assets/form-factors/manifest-data.js"></script>
    <script src="./data/partners-data.js?v=20260730-ti-refresh"></script>
    <script src="./app.js?v=20260730-wireless-filter" defer></script>
  </body>
</html>
