<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TI SOM Explorer</title>
    <link rel="icon" type="image/svg+xml" href="./assets/ti-bug.svg?v=20260730-logo-status-fix">
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("tiSomTheme") || "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=20261013-mobile-view">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="homeLink" type="button" aria-label="Return to SOM Explorer home">
          <img class="ti-mark" src="./assets/ti-bug.svg?v=20260730-logo-status-fix" alt="">
          <div>
            <h1>SOM Explorer</h1>
            <p id="sourceLine">Loading SOM data</p>
          </div>
        </button>
        <div class="toolbar" aria-label="Appearance">
          <button class="tool-button theme-toggle" id="themeToggle" type="button" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

    <div class="content-area">
      <main class="workbench">
        <aside class="control-rail" id="explorerControls" aria-label="Explorer filters and view controls">
          <div class="mobile-filter-heading">
            <h2 id="mobileFiltersTitle">Filters and display</h2>
            <button id="mobileFiltersClose" class="tool-button" type="button" aria-label="Close filters">Close</button>
          </div>
          <label class="field desktop-search">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Module, partner, device">
          </label>

          <fieldset class="field-group desktop-view">
            <legend>View</legend>
            <div class="segmented" role="group" aria-label="Visualization type">
              <button type="button" class="segment is-active" data-view-mode="board">Overview</button>
              <button type="button" class="segment" data-view-mode="map">Map</button>
              <button type="button" class="segment" data-view-mode="partners">Partners</button>
              <button type="button" class="segment" data-view-mode="formFactors">Form Factors</button>
              <button type="button" class="segment" data-view-mode="matrix">Matrix</button>
              <button type="button" class="segment" data-view-mode="directory">Directory</button>
            </div>
          </fieldset>

          <label class="field">
            <span>Group by</span>
            <select id="groupBy">
              <option value="device">Device</option>
              <option value="region">Region</option>
              <option value="vendor">Partner</option>
              <option value="formFactorFamily">Form factor</option>
              <option value="lifecycle">Status</option>
              <option value="partnerProgram">Partner program</option>
            </select>
          </label>

          <label class="field">
            <span>Color by</span>
            <select id="colorBy">
              <option value="formFactorFamily">Form factor</option>
              <option value="lifecycle">Status</option>
              <option value="region">Region</option>
              <option value="partnerProgram">Partner program</option>
              <option value="device">Device</option>
            </select>
          </label>

          <div class="filter-stack" id="filterStack"></div>

          <button class="reset-button" id="resetFilters" type="button">Reset filters</button>
          <div class="mobile-filter-actions">
            <button id="mobileApplyFilters" class="tool-button primary" type="button">Show modules</button>
          </div>
        </aside>

        <section class="workspace">
          <div class="mobile-controls" aria-label="Mobile explorer controls">
            <label class="mobile-search">
              <span class="sr-only">Search modules</span>
              <input id="mobileSearchInput" type="search" placeholder="Module, partner, device" autocomplete="off">
            </label>
            <label class="mobile-view">
              <span class="sr-only">View</span>
              <select id="mobileViewMode">
                <option value="directory">Modules</option>
                <option value="board">Overview</option>
                <option value="partners">Partners</option>
                <option value="formFactors">Form factors</option>
                <option value="map">Map</option>
                <option value="matrix">Matrix</option>
              </select>
            </label>
            <button id="mobileFiltersButton" class="mobile-filter-button tool-button" type="button" aria-controls="explorerControls" aria-expanded="false" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--ti-white)"/><circle cx="15" cy="17" r="3" fill="var(--ti-white)"/></svg>
              Filters <span id="mobileFilterCount" hidden>0</span>
            </button>
          </div>
          <div class="kpis" id="kpis"></div>

          <div class="view-meta">
            <div class="view-heading">
              <h2 id="viewTitle">Modules by device</h2>
              <div class="filter-status" id="filterStatus" aria-live="polite" hidden></div>
            </div>
            <div class="legend" id="legend" aria-label="Color legend"></div>
          </div>

          <section class="visualization" id="visualization"></section>
        </section>
      </main>

      <button id="filterBackdrop" type="button" tabindex="-1" aria-hidden="true" hidden></button>
      <aside class="detail-drawer" id="detailDrawer" aria-label="Module details" aria-hidden="true">
        <div class="drawer-inner">
          <button class="drawer-close" id="drawerClose" type="button" aria-label="Close details">Close</button>
          <div id="drawerContent"></div>
        </div>
      </aside>
    </div>

    <footer class="site-footer">
      <p class="footer-copyright">© Copyright 1995–2026 Texas Instruments Incorporated. All rights reserved.</p>
      <nav class="footer-links" aria-label="Texas Instruments policies">
        <a href="https://www.ti.com/legal/terms-conditions/cookie-policy.html">Cookie policy</a>
        <a href="https://www.ti.com/legal/terms-conditions/privacy-policy.html">Privacy policy</a>
        <a href="https://www.ti.com/legal/terms-conditions/terms-of-use.html">Terms of use</a>
        <a href="https://www.ti.com/legal/terms-conditions/trademarks.html">Trademarks</a>
      </nav>
    </footer>

    <noscript>TI SOM Explorer requires JavaScript.</noscript>
    <script src="./data/soms-data.js?v=20261013-ddr-filter"></script>
    <script src="./ddr-types.js?v=20261013-ddr-filter"></script>
    <script src="./assets/logos/manifest-data.js?v=20260901-catalog-refresh"></script>
    <script src="./assets/partner-badges/manifest-data.js?v=20260730-logo-status-fix"></script>
    <script src="./assets/form-factors/manifest-data.js"></script>
    <script src="./data/partners-data.js?v=20260901-catalog-refresh"></script>
    <script src="./app.js?v=20261013-mobile-view" defer></script>
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "065d709d-d587-46d7-bccf-224148861c48"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
